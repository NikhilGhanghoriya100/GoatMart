<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldHornLeft" x1="10" y1="10" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8b5e2a" />
    </linearGradient>
    <linearGradient id="goldHornRight" x1="90" y1="10" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8b5e2a" />
    </linearGradient>
    <linearGradient id="crownGrad" x1="40" y1="15" x2="60" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff2a8" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c160e" />
      <stop offset="50%" stop-color="#2d2215" />
      <stop offset="100%" stop-color="#120d07" />
    </linearGradient>
  </defs>

  <!-- Background Crest Rounded Square -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="#d4af37" stroke-width="3" />

  <!-- Left Majestic Horn -->
  <path d="M 50 38 C 36 16 16 14 12 28 C 8 40 18 46 28 44 C 36 42 44 40 50 38 Z" fill="url(#goldHornLeft)" />
  
  <!-- Right Majestic Horn -->
  <path d="M 50 38 C 64 16 84 14 88 28 C 92 40 82 46 72 44 C 64 42 56 40 50 38 Z" fill="url(#goldHornRight)" />

  <!-- Royal Crown Star -->
  <polygon points="50,14 53,22 61,22 55,27 57,35 50,30 43,35 45,27 39,22 47,22" fill="url(#crownGrad)" />

  <!-- Goat Ears -->
  <path d="M 34 44 C 20 46 16 54 20 60 C 24 62 32 54 36 48 Z" fill="#d4d4d8" />
  <path d="M 66 44 C 80 46 84 54 80 60 C 76 62 68 54 64 48 Z" fill="#d4d4d8" />

  <!-- Goat Face Geometry -->
  <path d="M 36 42 L 64 42 L 60 68 L 50 84 L 40 68 Z" fill="#ffffff" />

  <!-- Muzzle & Beard -->
  <path d="M 46 72 L 54 72 L 50 82 Z" fill="#d4af37" />
  <path d="M 50 82 L 48 90 L 52 90 Z" fill="#d4af37" />

  <!-- Nose & Bridge -->
  <path d="M 50 42 L 50 70 M 45 72 L 55 72" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round" />

  <!-- Eyes -->
  <ellipse cx="43" cy="52" rx="3.5" ry="2" fill="#1c1917" />
  <ellipse cx="57" cy="52" rx="3.5" ry="2" fill="#1c1917" />
  <circle cx="44" cy="51" r="1" fill="#ffffff" />
  <circle cx="58" cy="51" r="1" fill="#ffffff" />
</svg>
